# docs/recipe_design.md §6, phase 9: every push and pull request, on CPU, from a fresh clone.
# GPU checks (real weights, aligner, canaries, harness) run in notebooks/phase0_phase1_colab.ipynb.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff (bug-class rules in pyproject.toml)
        run: uvx ruff@0.6.9 check xtts_trainer eval scripts tests

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: System audio libraries (torchcodec, which coqui-tts uses for audio IO, loads FFmpeg's shared libraries)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install exactly what uv.lock pins
        run: uv sync --frozen --extra dev
      - name: Fetch and hash-verify the small upstream artifacts (vocab, config, mel_stats)
        run: uv run python scripts/fetch_base_artifacts.py --dest xtts_base --only vocab.json config.json mel_stats.pth
      - name: Tests (model-weight tests skip without model.pth / dvae.pth)
        run: uv run pytest -q -p no:cacheprovider
