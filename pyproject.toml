[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-xtts-trainer"
version = "0.1.0"
description = "Complete 3-Stage Training Suite for XTTS v2 (DVAE, GPT Backbone, and Latent HiFi-GAN Vocoder)"
readme = "README.md"
authors = [
    { name = "Community Contributor" }
]
license = { text = "MPL-2.0" }
keywords = ["tts", "xtts", "xtts-v2", "deep-learning", "speech-synthesis", "voice-cloning"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "coqui-tts @ git+https://github.com/idiap/coqui-ai-TTS.git",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
eval = [
    "jiwer>=3.0.0",
    "pesq>=0.0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["xtts_trainer*"]

[tool.setuptools.package-data]
xtts_trainer = ["mel_stats.pth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
