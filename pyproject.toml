[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-xtts-trainer"
version = "0.1.0"
description = "Complete 3-Stage Training Suite for XTTS v2 (DVAE, GPT Backbone, and Latent HiFi-GAN Vocoder)"
readme = "README.md"
authors = [
    { name = "Community Contributor" }
]
license = { text = "MPL-2.0" }
keywords = ["tts", "xtts", "xtts-v2", "deep-learning", "speech-synthesis", "voice-cloning"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    # [codec]: torchcodec, which coqui-tts requires for audio IO from PyTorch 2.9 (it raises ImportError without it)
    "coqui-tts[codec] @ git+https://github.com/idiap/coqui-ai-TTS.git@03339e5b790b5e16ea8867a142e8bb26ec646d94",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
eval = [
    "jiwer>=3.0.0",
    "pesq>=0.0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["xtts_trainer*"]

[tool.setuptools.package-data]
xtts_trainer = ["mel_stats.pth", "spec/xtts_v2_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Delete each passing test's tmp_path when it finishes. Stage 3 tests write ~800 MB training states, and keeping
# them all filled the CI runner's disk (CI run 40114391317). Failed tests keep theirs for debugging.
tmp_path_retention_policy = "failed"
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# docs/recipe_design.md §6, phase 9: no swallowed exceptions (broad except, bare except, try-except-pass), no syntax errors.
# Style rules are deliberately not enforced here; this gate is for bug classes.
select = ["E9", "E722", "BLE001", "S110"]
